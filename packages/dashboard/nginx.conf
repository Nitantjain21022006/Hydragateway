server {
    listen 80;
    server_name _;

    # ── Serve React static files ────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── React Router – all unknown paths fall through to index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /api/* → Load Balancer ───────────────────────────────────────────
    # The React app calls window.location/api/... which Nginx forwards to the LB.
    # This avoids any CORS issues inside Docker networking.
    location /api/ {
        proxy_pass         http://load-balancer:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Health check for the dashboard container itself ────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Gzip compression ────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
